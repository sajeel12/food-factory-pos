name: Windows release

# Builds the Windows installer on GitHub's Windows machines.
#
# Release a new version (installed POS apps update themselves from it):
#   git tag v1.0.1
#   git push origin v1.0.1
# The tag sets the app version, so each new tag must be higher than the last.
#
# "Run workflow" from the Actions tab builds a test installer without releasing it;
# download it from the run's Artifacts.
#
# One-time setup: add a repository secret named UPDATE_TOKEN (Settings > Secrets and
# variables > Actions) holding a fine-grained token with read-only "Contents" access to
# this repo only. The installed apps use it to download releases from this private repo.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Set app version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Add update token to the packaged .env
        shell: bash
        env:
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: |
          if [ -z "$UPDATE_TOKEN" ]; then
            echo "::error::Repository secret UPDATE_TOKEN is missing; installed apps could not download updates"
            exit 1
          fi
          printf '\nUPDATE_TOKEN=%s\n' "$UPDATE_TOKEN" >> .env

      - run: npm run build

      - name: Build installer and publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build test installer (no release)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --win --publish never

      - name: Upload test installer
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: FoodFactoryPOS-Setup
          path: release/*.exe
